#
# Inferno easy-boot defaults for QEMU / PC BIOS
#
# Override any of these for expert setups. Lines starting with *
# are consumed by the kernel/loader and are not exported as env vars.
#
# bootfile: device!file — see man/10/9load
#

bootfile=fd0!ieasy

# QEMU: run-qemu.sh uses rtl8139 (matches ether8139 in os/pc/easy)
# Also works with: type=AMD79C970  (QEMU -device pcnet)
ether0=type=rtl8139

# Console / debugging comfort for first boots
*kernelpercent=40
console=0 b9600

# Friendly service ports (see docs/NETWORK_PORTS.md)
# These are conventions for apps/scripts — not kernel magic.
#   loco=8080   local services on this machine
#   grid=9090   shared / distributed services
loco=8080
grid=9090
